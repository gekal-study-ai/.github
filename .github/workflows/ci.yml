name: CI

# main へ向いた PR すべてで走らせる。
# paths フィルタは付けないこと — 必須チェックに指定した際、
# 対象外のファイルだけを触った PR でチェックが永久に pending になり
# マージできなくなるため。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    name: build-site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # next build が TypeScript の型検査も行う
      - run: npm run build

      - name: 静的書き出しの中身を確認する
        run: |
          test -f out/index.html
          test -f out/roadmap/index.html
          test -f out/CNAME
          test -f out/.nojekyll
